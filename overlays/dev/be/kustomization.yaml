apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: timetable-planner-dev
resources:
- secret.yaml
- configmap.yaml
- ../../../base/be

patches:
- path: ingress-patch.json
  target:
    kind: Ingress
    name: timetable-planner-be-ingress
- path: deployment-config-patch.json
  target:
    kind: Deployment
    name: timetable-planner-be-deployment

images:
- name: scgskku/timetable-planner-be
  newName: scgskku/timetable-planner-be-dev
  newTag: d64e85a18aaa5957a15df25952ed08b6e2d3d87f
