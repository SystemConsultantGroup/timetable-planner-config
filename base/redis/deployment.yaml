apiVersion: apps/v1
kind: Deployment
metadata:
  name: timetable-planner-redis-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: timetable-planner-redis
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timetable-planner-redis
    spec:
      containers:
      - name: timetable-planner-redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        args:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - $(REDIS_PASSWORD)
        envFrom:
        - secretRef:
            name: timetable-planner-redis-secret
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}